apply plugin: 'com.huawei.ohos.hap'

ohos {
    compileSdkVersion 7
    defaultConfig {
        // 上游 crabKeyboard 用 compatibleSdkVersion 7；Fit 3 固件是否支持需要真机 spike。
        // 如果设备固件 API 较低导致安装失败，可尝试改成 compatibleSdkVersion 3（倒数日 rect408entry 的
        // compatible=3 / target=6 能装），但键盘页面是否还能跑要重新验证。
        compatibleSdkVersion 7
    }
    buildTypes {
        release {
            proguardOpt {
                proguardEnabled false
                rulesFiles 'proguard-rules.pro'
            }
        }
    }
}

dependencies {
}
