android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# SaltUI 3.0.0 is built with Kotlin 2.4.20, while AGP 9.1.1's built-in Kotlin is 2.2.10.
# Opt out of AGP built-in Kotlin and use the Kotlin 2.4.20 plugin instead. AGP 10 will remove
# this escape hatch; migrate to built-in Kotlin once SaltUI/AGP versions align.
android.builtInKotlin=false
# kotlin-android is not compatible with AGP 9's new DSL.
android.newDsl=false
